# Coleta das condições da Ponte Rio-Niterói.
# Disparado pelo cron-job.org (a cada 5 min, todos os dias) via API
# workflow_dispatch. Repositório público: minutos do Actions sem limite.
# Segredos necessários (Settings > Secrets and variables > Actions):
#   FIREBASE_DB_URL  e  PONTE_TOKEN
#
# A Ecovias (Akamai) recusa com 403 alguns endereços das máquinas do
# GitHub. Cada job roda numa máquina nova: se a primeira levar 403, a
# segunda tenta, depois a terceira. Só a última grava a falha, e só ela
# deixa a execução vermelha (= e-mail do GitHub só quando as 3 falham).
name: Coleta da Ponte

on:
  workflow_dispatch:

concurrency:
  group: coleta
  cancel-in-progress: false

env:
  FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
  PONTE_TOKEN: ${{ secrets.PONTE_TOKEN }}

jobs:
  tentativa1:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.coleta.outputs.ok }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - id: coleta
        run: dart pub get && dart run bin/coletar.dart
        env:
          ULTIMA_TENTATIVA: '0'

  tentativa2:
    needs: tentativa1
    if: needs.tentativa1.outputs.ok != 'true'
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.coleta.outputs.ok }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - id: coleta
        run: dart pub get && dart run bin/coletar.dart
        env:
          ULTIMA_TENTATIVA: '0'

  tentativa3:
    needs: [tentativa1, tentativa2]
    if: always() && needs.tentativa1.outputs.ok != 'true' && needs.tentativa2.outputs.ok != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - id: coleta
        run: dart pub get && dart run bin/coletar.dart
        env:
          ULTIMA_TENTATIVA: '1'
